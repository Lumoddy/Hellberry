[package]
name = "Hellberry"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
local-ip-address = "0.6.13"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_lenient = "0.2.4"
serde_yaml = "0.9.34"
tokio = { version = "1.53.2", features = ["full"] }
tokio-serial = "5.5.0"